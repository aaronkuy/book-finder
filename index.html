<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Finder</title>
    <meta name="description" content="Search the Open Library catalogue for books by title, author or keyword." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="app">
    <header class="hero">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 4.5C5 3.7 5.7 3 6.5 3H19v14H6.5C5.7 17 5 17.7 5 18.5V4.5Z" />
                <path d="M5 18.5C5 19.3 5.7 20 6.5 20H19" />
                <path d="M9 7.5h6" />
            </svg>
        </div>
        <h1>Book Finder</h1>
        <p class="tagline">Search the Open Library catalogue by title, author or keyword.</p>
    </header>

    <form class="search" id="search-form" role="search">
        <label class="visually-hidden" for="search-input">Search books by title, author or keyword</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
        </svg>
        <input type="search" id="search-input" name="q" placeholder="Title, author or keyword" autocomplete="off" />
        <button type="submit" id="search-button">Search</button>
    </form>

    <!-- Two separate lines: screen readers announce a status politely and an alert at once. -->
    <p class="message" id="status" role="status"></p>
    <p class="message message-error" id="error" role="alert" hidden></p>

    <ul id="results"></ul>
</main>

<footer class="footer">
    <a href="https://github.com/aaronkuy">Aaron Kuyucu</a> · <a href="https://github.com/aaronkuy/book-finder">Source on GitHub</a> · Book data and covers from <a href="https://openlibrary.org/">Open Library</a>
</footer>

<script type="module" src="script.js"></script>
</body>
</html>
